# CI lint gate. Deliberately focused: real errors (pyflakes, pycodestyle
# errors) plus import ordering — not style opinions. Pinning the ruleset
# keeps the gate stable across ruff upgrades.
[lint]
select = ["E4", "E7", "E9", "F", "I"]

[lint.per-file-ignores]
# setup_logging() must run before the imports whose import-time logging it
# formats — imports below it are intentional.
"app/main.py" = ["E402"]
