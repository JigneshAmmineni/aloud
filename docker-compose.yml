services:
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_BACKEND_WS_URL=ws://localhost:8000
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      # Mount host ADC credentials read-only into the container
      - ${APPDATA}/gcloud/application_default_credentials.json:/gcloud/application_default_credentials.json:ro
    environment:
      - GOOGLE_CLOUD_PROJECT=aloud-498522
      - GOOGLE_CLOUD_LOCATION=us-central1
      - GOOGLE_APPLICATION_CREDENTIALS=/gcloud/application_default_credentials.json
      - PYTHONUNBUFFERED=1
