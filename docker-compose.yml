services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://aloud:aloud@db:5432/aloud
      # Windows bind mounts emit no inotify events inside the container
      # and watchfiles ignores its own polling env var, so scripts/
      # dev_watch.py passes force_polling explicitly (found 2026-10-11:
      # four hours of edits served stale code with zero reloads logged)
    ports:
      - "7860:7860"
    volumes:
      - ./backend:/app
    command: python scripts/dev_watch.py
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=aloud
      - POSTGRES_PASSWORD=aloud
      - POSTGRES_DB=aloud
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aloud"]
      interval: 3s
      timeout: 3s
      retries: 10

  frontend:
    image: node:22-alpine
    working_dir: /app
    environment:
      - BACKEND_URL=http://backend:7860
      - WATCHPACK_POLLING=true
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"
    depends_on:
      - backend

volumes:
  frontend_node_modules:
  pgdata:
