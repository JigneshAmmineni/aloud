name: CI

on:
  pull_request:
    paths-ignore: ["**.md"]
  push:
    branches: [main]
    paths-ignore: ["**.md"]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # Throwaway Postgres for the FR-31 RLS tests — they must run through a
      # real NOSUPERUSER role, which SQLite can't express.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aloud
          POSTGRES_PASSWORD: aloud
          POSTGRES_DB: aloud
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aloud"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # match backend/Dockerfile (python:3.12-slim) — CI mirrors deploy
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (pytest)
        run: python -m pytest -q
        env:
          RLS_TEST_DATABASE_URL: postgresql+asyncpg://aloud:aloud@localhost:5432/aloud

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build (type-checks and compiles)
        run: npm run build
